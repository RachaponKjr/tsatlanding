version: "3.8"

services:
  frontend:
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: /api/landing
    container_name: tsat-landing-front
    read_only: true
    restart: always
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:3031:3000"
    security_opt:
      - no-new-privileges:true
    environment:
      NEXT_PUBLIC_API_URL: /api/landing
      API_URL: http://tsat-landing-back:3001/api/v1
    depends_on:
      - backend
    networks:
      - tsat-landing-network

  backend:
    build:
      context: ./back-end
    container_name: tsat-landing-back
    restart: always
    ports:
      - "127.0.0.1:4000:3001"
    environment:
      DATABASE_URL: postgresql://dblanding:H9VBy9ECbAZesKweFR6Rvbbgv@db:5432/dblanding
      JWT_SECRET: G16JugJ3RpYzVQQeAU4ptYcBRXVzKLGd6YHePIS6XTqIrRDoF47j+r8m9wO/pVwP
    depends_on:
      - db
    networks:
      - tsat-landing-network

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: dblanding
      POSTGRES_PASSWORD: H9VBy9ECbAZesKweFR6Rvbbgv
      POSTGRES_DB: dblanding
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - tsat-landing-network

volumes:
  pgdata:

networks:
  tsat-landing-network:
    driver: bridge
